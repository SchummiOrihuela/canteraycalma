<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo cremita redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#F4EAD7"/>
  <!-- Borde sutil forest -->
  <rect x="8" y="8" width="496" height="496" rx="90" fill="none" stroke="#3B6357" stroke-width="10" opacity="0.28"/>

  <!-- Sol dorado sobrio -->
  <circle cx="374" cy="140" r="40" fill="#C79A3C"/>

  <!-- Colina forest de fondo -->
  <ellipse cx="256" cy="392" rx="230" ry="96" fill="#3B6357" opacity="0.16"/>

  <!-- Pirámide escalonada — verde forest (Zona Arqueológica de Malinalco) -->
  <!-- Base -->
  <rect x="96"  y="356" width="320" height="42" rx="6" fill="#2E4E44"/>
  <!-- Nivel 2 -->
  <rect x="138" y="314" width="236" height="44" rx="6" fill="#3B6357"/>
  <!-- Nivel 3 -->
  <rect x="182" y="272" width="148" height="44" rx="6" fill="#4C7A6B"/>
  <!-- Nivel 4 cima -->
  <rect x="216" y="232" width="80"  height="42" rx="6" fill="#5E9382"/>

  <!-- Templo monolítico en la cima -->
  <rect x="226" y="192" width="60" height="42" rx="5" fill="#8B5E3C"/>
  <!-- Puerta del templo -->
  <rect x="247" y="212" width="18" height="22" rx="2" fill="#F4EAD7"/>

  <!-- Escalinata central -->
  <rect x="250" y="234" width="12" height="124" rx="3" fill="#F4EAD7" opacity="0.32"/>

  <!-- Vegetación forest a los lados -->
  <circle cx="134" cy="322" r="20" fill="#3B6357" opacity="0.85"/>
  <circle cx="112" cy="344" r="14" fill="#2E4E44" opacity="0.75"/>
  <circle cx="378" cy="322" r="20" fill="#3B6357" opacity="0.85"/>
  <circle cx="400" cy="344" r="14" fill="#2E4E44" opacity="0.75"/>
</svg>
